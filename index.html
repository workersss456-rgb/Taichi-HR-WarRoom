<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>太綺工程 - 智慧派工調度與員工排休系統</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@1.39.0"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas-pro@2.4.1/dist/html2canvas-pro.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&display=swap');
  body { font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-16">

<!-- 頂部導覽列 -->
<header class="bg-slate-900 text-white shadow-md sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-3 sm:px-4 py-3 flex flex-wrap justify-between items-center gap-2">
    <div class="flex items-center space-x-2.5">
      <div class="bg-blue-600 px-2 py-1 rounded text-white font-black text-sm tracking-wider">太綺</div>
      <div>
        <h1 class="text-sm sm:text-base font-bold tracking-wide leading-tight">案場智慧派工與排休系統</h1>
        <p class="text-[11px] text-slate-400 leading-none flex items-center gap-1.5 mt-0.5">
          <span id="cloudStatusBadge" class="inline-block w-2 h-2 rounded-full bg-emerald-400"></span>
          <span id="cloudStatusText">系統就緒</span>
          <span id="lastUpdateInfo" class="text-slate-500"></span>
        </p>
      </div>
    </div>
    
    <div id="managerControls" class="flex flex-wrap items-center gap-2">
      <div class="flex items-center bg-slate-800 rounded-xl p-1 border border-slate-700">
        <button type="button" onclick="showShareUrlModal('leave')" class="px-2.5 py-1 text-xs font-bold rounded-lg text-amber-400 hover:bg-slate-700 transition flex items-center">
          <i data-lucide="link" class="w-3.5 h-3.5 mr-1"></i> 排休連結
        </button>
        <button type="button" onclick="showShareUrlModal('manager')" class="px-2.5 py-1 text-xs font-bold rounded-lg text-blue-400 hover:bg-slate-700 transition flex items-center">
          <i data-lucide="shield-check" class="w-3.5 h-3.5 mr-1"></i> 主管連結
        </button>
      </div>

      <div class="flex items-center bg-slate-800 p-1 rounded-xl border border-slate-700">
        <button onclick="switchTab('dispatch')" id="tabBtn_dispatch" class="px-3 py-1 text-xs font-bold rounded-lg bg-blue-600 text-white transition">主管每日派工</button>
        <button onclick="switchTab('confirm')" id="tabBtn_confirm" class="px-3 py-1 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition">每日排班確認</button>
        <button onclick="switchTab('leave')" id="tabBtn_leave" class="px-3 py-1 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition">員工月曆排休</button>
        <button onclick="openApiSettingModal()" class="ml-1 px-2 py-1 text-xs text-slate-400 hover:text-white" title="設定後台">
          <i data-lucide="settings" class="w-3.5 h-3.5"></i>
        </button>
      </div>
      <button type="button" onclick="openImportLeaveModal()" class="bg-emerald-700 hover:bg-emerald-600 text-white text-xs font-bold px-3 py-2 rounded-xl shadow transition flex items-center">
        <i data-lucide="file-spreadsheet" class="w-3.5 h-3.5 mr-1"></i> 批量匯入排班
      </button>
    </div>
  </div>
</header>

<!-- 分頁一：主管每日派工調度頁面 -->
<div id="view_dispatch" class="space-y-4">
  <div class="max-w-7xl mx-auto px-3 sm:px-4 pt-4 flex flex-wrap justify-between items-center gap-2">
    <div class="flex flex-wrap items-center gap-2">
      <div class="flex items-center bg-white rounded-xl px-3 py-1.5 shadow-sm border border-slate-200">
        <i data-lucide="calendar" class="w-4 h-4 text-blue-600 mr-2"></i>
        <span class="text-xs text-slate-500 font-bold mr-2">派工日期:</span>
        <input type="date" id="dispatchDate" onchange="onDispatchDateChange()" class="text-xs font-bold bg-transparent text-slate-800 focus:outline-none cursor-pointer">
      </div>
      
      <!-- 鎖定當日排班按鈕 -->
      <button id="lockDispatchBtn" onclick="toggleDispatchLock()" class="hidden px-3 py-2 rounded-xl text-xs font-bold shadow transition flex items-center">
        🔒 鎖定當日排班
      </button>

      <button onclick="openCreateGroupModal()" class="dispatch-control bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold px-3 py-2 rounded-xl shadow transition flex items-center">
        <i data-lucide="folder-plus" class="w-3.5 h-3.5 mr-1 text-blue-400"></i> ➕ 成立新組別
      </button>
      <button onclick="openAddSiteGlobalModal()" class="dispatch-control bg-white hover:bg-slate-50 text-slate-700 text-xs font-bold px-3 py-2 rounded-xl border border-slate-300 shadow-sm transition flex items-center">
        <i data-lucide="map-pin" class="w-3.5 h-3.5 mr-1 text-emerald-600"></i> ➕ 新增案場
      </button>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="generateLineMessage('ALL')" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-3 py-2 rounded-xl shadow transition flex items-center">
        <i data-lucide="layers" class="w-3.5 h-3.5 mr-1"></i> 全公司派工彙整
      </button>
      <button onclick="exportNodeAsJpg('dispatchExportArea', '每日派工_' + document.getElementById('dispatchDate').value)" class="bg-white hover:bg-slate-50 text-slate-700 text-xs font-bold px-3 py-2 rounded-xl border border-slate-300 shadow-sm transition flex items-center">
        <i data-lucide="image-down" class="w-3.5 h-3.5 mr-1 text-blue-600"></i> 另存圖片(jpg)
      </button>
    </div>
  </div>

  <main class="max-w-7xl mx-auto px-3 sm:px-4 space-y-4" id="dispatchExportArea">
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2.5 sm:gap-4">
      <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
          <p class="text-[11px] text-slate-500 font-medium">總編制本工</p>
          <p class="text-xl sm:text-2xl font-black text-slate-800" id="totalMembers">0 人</p>
        </div>
        <div class="p-2.5 bg-blue-50 text-blue-600 rounded-lg"><i data-lucide="users" class="w-4 h-4 sm:w-5 sm:h-5"></i></div>
      </div>
      <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
          <p class="text-[11px] text-slate-500 font-medium">今日排休 / 請假</p>
          <p class="text-xl sm:text-2xl font-black text-amber-600" id="totalOffCount">0 人</p>
        </div>
        <div class="p-2.5 bg-amber-50 text-amber-600 rounded-lg"><i data-lucide="calendar-x" class="w-4 h-4 sm:w-5 sm:h-5"></i></div>
      </div>
      <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
          <p class="text-[11px] text-slate-500 font-medium">今日出勤本工</p>
          <p class="text-xl sm:text-2xl font-black text-emerald-600" id="totalWorkCount">0 工</p>
        </div>
        <div class="p-2.5 bg-emerald-50 text-emerald-600 rounded-lg"><i data-lucide="hard-hat" class="w-4 h-4 sm:w-5 sm:h-5"></i></div>
      </div>
      <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
          <p class="text-[11px] text-slate-500 font-medium">外部點工總計</p>
          <p class="text-xl sm:text-2xl font-black text-purple-600" id="totalTempCount">0 工</p>
        </div>
        <div class="p-2.5 bg-purple-50 text-purple-600 rounded-lg"><i data-lucide="user-plus" class="w-4 h-4 sm:w-5 sm:h-5"></i></div>
      </div>
      <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
          <p class="text-[11px] text-slate-500 font-medium">今日發包人數</p>
          <p class="text-xl sm:text-2xl font-black text-cyan-600" id="totalSubcontractCount">0 人</p>
        </div>
        <div class="p-2.5 bg-cyan-50 text-cyan-600 rounded-lg"><i data-lucide="hard-hat" class="w-4 h-4 sm:w-5 sm:h-5"></i></div>
      </div>
    </div>

    <!-- 各組別派工卡片列表容器 -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4" id="groupsContainer"></div>
  </main>
</div>

<!-- 分頁二：每日排班確認總覽 -->
<div id="view_confirm" class="hidden max-w-4xl mx-auto px-3 sm:px-4 pt-4 space-y-4">
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-6 space-y-4">
    <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 pb-3">
      <h2 class="text-base font-bold text-slate-900 flex items-center">
        <i data-lucide="calendar-check-2" class="w-5 h-5 text-blue-600 mr-2"></i> 每日排班確認
      </h2>
      <div class="flex items-center gap-2">
        <input type="date" id="confirmDate" class="text-sm font-bold border border-slate-300 rounded-xl px-3 py-1.5 bg-slate-50 text-slate-800 focus:outline-none">
      </div>
    </div>
  </div>
</div>

<!-- 分頁三：員工專用月曆排休專區 -->
<div id="view_leave" class="hidden max-w-4xl mx-auto px-3 sm:px-4 pt-4 space-y-4">
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-6 space-y-4">
    <div class="border-b border-slate-100 pb-3 flex flex-wrap justify-between items-center gap-3">
      <div>
        <h2 class="text-base font-bold text-slate-900 flex items-center">
          <i data-lucide="calendar-days" class="w-5 h-5 text-blue-600 mr-2"></i> 員工整月休假填報專區
        </h2>
        <p class="text-xs text-slate-500">請選取姓名、年份與月份，點選假別後直接在日曆上點擊即可排休</p>
      </div>
      
      <div class="flex flex-wrap items-center gap-2">
        <select id="leaveMemberSelect" onchange="loadMemberMonthlyLeave()" class="text-xs font-bold border border-slate-300 rounded-xl px-3 py-2 bg-slate-50 text-blue-700 focus:outline-none min-w-[130px]">
          <option value="">-- 請選擇姓名 --</option>
        </select>
        
        <div class="flex items-center space-x-1 bg-slate-50 border border-slate-300 rounded-xl px-2 py-1">
          <select id="leaveYearSelect" onchange="onYearMonthChange()" class="text-xs font-black bg-transparent text-slate-800 focus:outline-none cursor-pointer">
            <option value="2025">2025 年</option>
            <option value="2026" selected>2026 年</option>
            <option value="2027">2027 年</option>
          </select>
          <span class="text-xs text-slate-300">|</span>
          <select id="leaveMonthOnlySelect" onchange="onYearMonthChange()" class="text-xs font-black bg-transparent text-blue-700 focus:outline-none cursor-pointer">
            <option value="01">1 月</option><option value="02">2 月</option><option value="03">3 月</option>
            <option value="04">4 月</option><option value="05">5 月</option><option value="06">6 月</option>
            <option value="07">7 月</option><option value="08">8 月</option><option value="09" selected>9 月</option>
            <option value="10">10 月</option><option value="11">11 月</option><option value="12">12 月</option>
          </select>
        </div>
      </div>
    </div>

    <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <span class="text-xs font-bold text-slate-700 flex items-center">
          <i data-lucide="check-circle-2" class="w-4 h-4 mr-1 text-blue-600"></i> 當前筆刷假別：
        </span>
        <span class="text-xs font-bold text-slate-600">
          本月已排休天數：<span id="totalLeaveDaysBadge" class="text-blue-600 font-black text-sm">0</span> 天
        </span>
      </div>
      
      <div class="grid grid-cols-3 sm:grid-cols-6 gap-1.5 pt-1">
        <button onclick="setActiveLeaveType('')" class="px-2.5 py-1.5 rounded-lg text-xs font-bold border bg-blue-600 text-white">出勤 (清除)</button>
        <button onclick="setActiveLeaveType('例假')" class="px-2.5 py-1.5 rounded-lg text-xs font-bold border bg-white text-red-600 border-red-200">🔴 例假</button>
        <button onclick="setActiveLeaveType('排休')" class="px-2.5 py-1.5 rounded-lg text-xs font-bold border bg-white text-amber-600 border-amber-200">🟡 排休</button>
        <button onclick="setActiveLeaveType('特休')" class="px-2.5 py-1.5 rounded-lg text-xs font-bold border bg-white text-purple-600 border-purple-200">🟣 特休</button>
        <button onclick="setActiveLeaveType('國定假')" class="px-2.5 py-1.5 rounded-lg text-xs font-bold border bg-white text-blue-600 border-blue-200">🔵 國定假</button>
        <button onclick="setActiveLeaveType('事病假')" class="px-2.5 py-1.5 rounded-lg text-xs font-bold border bg-white text-rose-600 border-rose-200">🟠 事病假</button>
      </div>
    </div>

    <div id="calendarGrid" class="grid grid-cols-7 gap-1 sm:gap-2 text-center pt-2"></div>

    <div class="pt-3 border-t border-slate-100 flex justify-end">
      <button onclick="submitMonthlyLeave()" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl shadow-lg transition">送出並儲存本月排休表</button>
    </div>
  </div>
</div>

<!-- 員工換組 Modal 彈窗 -->
<div id="transferGroupModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
  <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-5 space-y-4">
    <div class="flex justify-between items-center border-b pb-2">
      <h3 class="font-bold text-slate-800 text-base flex items-center">
        <i data-lucide="git-merge" class="w-4 h-4 text-blue-600 mr-1.5"></i> 員工調換組別
      </h3>
      <button onclick="closeTransferModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    
    <div class="space-y-3">
      <div class="bg-slate-50 p-3 rounded-lg border">
        <p class="text-xs text-slate-500 mb-0.5">準備轉調同仁：</p>
        <p id="transferMemberName" class="text-base font-bold text-blue-600"></p>
      </div>
      <input type="hidden" id="transferMemberId">
      <input type="hidden" id="transferOldGroupId">

      <div>
        <label class="text-xs font-bold text-slate-700 mb-1 block">請選擇目標組別：</label>
        <select id="transferTargetGroupSelect" class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 bg-white focus:outline-none"></select>
      </div>
    </div>

    <div class="flex justify-end space-x-2 pt-2 border-t">
      <button onclick="closeTransferModal()" class="px-3 py-1.5 border border-slate-300 text-slate-600 text-xs rounded-lg font-medium">取消</button>
      <button onclick="confirmTransferGroup()" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-lg shadow">確認換組</button>
    </div>
  </div>
</div>

<!-- API 網址設定 Modal -->
<div id="apiSettingModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
  <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-5 space-y-4">
    <div class="flex justify-between items-center border-b pb-2">
      <h3 class="font-bold text-slate-800 text-base">Google 試算表連線設定</h3>
      <button onclick="closeApiSettingModal()"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    <div>
      <label class="text-xs text-slate-600 font-bold mb-1 block">Google Apps Script Web App URL:</label>
      <input type="text" id="apiInput" placeholder="https://script.google.com/macros/s/.../exec" class="w-full text-xs font-mono border rounded-lg px-3 py-2.5">
    </div>
    <div>
      <label class="text-xs text-slate-600 font-bold mb-1 block">操作人員姓名:</label>
      <input type="text" id="operatorNameInput" placeholder="例：王大明" class="w-full text-sm border rounded-lg px-3 py-2">
    </div>
    <div class="flex justify-end space-x-2 pt-2">
      <button onclick="closeApiSettingModal()" class="px-3 py-1.5 border text-xs rounded-lg">取消</button>
      <button onclick="saveApiSetting()" class="px-4 py-1.5 bg-blue-600 text-white text-xs rounded-lg">儲存設定</button>
    </div>
  </div>
</div>

<!-- 系統載入遮罩 -->
<div id="loadingOverlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[60] flex flex-col items-center justify-center hidden">
  <div class="animate-spin rounded-full h-10 w-10 border-4 border-blue-500 border-t-transparent mb-3"></div>
  <p class="text-white font-bold text-sm tracking-wide" id="loadingText">系統處理中，請稍候...</p>
</div>

<!-- JavaScript 完整核心邏輯 -->
<script>
  lucide.createIcons();

  let AppState = {
    groupsData: [
      {
        id: 'g1',
        name: '第一工程組',
        members: [
          { id: 'm1', name: '張三' },
          { id: 'm2', name: '李四' }
        ]
      },
      {
        id: 'g2',
        name: '第二工程組',
        members: [
          { id: 'm3', name: '王五' }
        ]
      }
    ],
    monthlyLeavesDb: {},
    savedTempWorkers: [],
    subcontractData: {},
    dailyTempWorkers: {},
    dailyDispatchData: {},
    stateMeta: null
  };

  let apiConfig = {
    url: localStorage.getItem('taichi_api_url') || '',
    operator: localStorage.getItem('taichi_operator') || ''
  };

  let currentLeaveType = '';
  let currentYearMonth = '';

  function toggleLoading(show, text = '系統處理中，請稍候...') {
    const overlay = document.getElementById('loadingOverlay');
    document.getElementById('loadingText').innerText = text;
    if (show) overlay.classList.remove('hidden');
    else overlay.classList.add('hidden');
  }

  function switchTab(tabId) {
    ['dispatch', 'confirm', 'leave'].forEach(tab => {
      const view = document.getElementById('view_' + tab);
      if (view) {
        if (tab === tabId) view.classList.remove('hidden');
        else view.classList.add('hidden');
      }
      
      const btn = document.getElementById('tabBtn_' + tab);
      if (btn) {
        if (tab === tabId) {
          btn.classList.add('bg-blue-600', 'text-white');
          btn.classList.remove('text-slate-400');
        } else {
          btn.classList.remove('bg-blue-600', 'text-white');
          btn.classList.add('text-slate-400');
        }
      }
    });
  }

  function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
  function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
  function openApiSettingModal() { openModal('apiSettingModal'); }
  function closeApiSettingModal() { closeModal('apiSettingModal'); }
  function openImportLeaveModal() { openModal('importLeaveModal'); }
  function closeImportLeaveModal() { closeModal('importLeaveModal'); }
  function openCreateGroupModal() { alert('建立組別功能觸發'); }
  function openAddSiteGlobalModal() { alert('新增案場功能觸發'); }
  function generateLineMessage(type) { alert('生成 Line 派工訊息'); }
  function exportNodeAsJpg(id, fileName) { alert('匯出圖片：' + fileName); }
  function showShareUrlModal(type) { alert('分享連結：' + type); }

  // API 互動
  async function fetchAppData() {
    if (!apiConfig.url) return;
    toggleLoading(true, '載入雲端資料中...');
    try {
      const res = await fetch(`${apiConfig.url}?action=getAll`);
      const data = await res.json();
      if (data && data.groupsData) {
        AppState = Object.assign(AppState, data);
        updateUIWithData();
        updateHeaderStatus(true, AppState.stateMeta);
      }
    } catch (error) {
      console.error('API 讀取失敗:', error);
      updateHeaderStatus(false);
    }
    toggleLoading(false);
  }

  async function saveStateToCloud() {
    if (!apiConfig.url) return alert('請先設定 API 網址！');
    toggleLoading(true, '儲存資料至雲端...');
    try {
      const payload = { action: 'saveState', operatorName: apiConfig.operator, ...AppState };
      const res = await fetch(apiConfig.url, { method: 'POST', body: JSON.stringify(payload) });
      const result = await res.json();
      if (result.status === 'ok') {
        AppState.stateMeta = result.stateMeta;
        updateHeaderStatus(true, AppState.stateMeta);
        alert('儲存成功！');
      }
    } catch (error) {
      alert('資料儲存失敗，請檢查網路連線。');
    }
    toggleLoading(false);
  }

  function saveApiSetting() {
    const url = document.getElementById('apiInput').value.trim();
    const operator = document.getElementById('operatorNameInput').value.trim();
    if (!url) return alert('請輸入 API 網址');
    localStorage.setItem('taichi_api_url', url);
    localStorage.setItem('taichi_operator', operator);
    apiConfig.url = url;
    apiConfig.operator = operator;
    closeApiSettingModal();
    fetchAppData();
  }

  function updateHeaderStatus(isOnline, meta = null) {
    const badge = document.getElementById('cloudStatusBadge');
    const text = document.getElementById('cloudStatusText');
    const info = document.getElementById('lastUpdateInfo');
    if (isOnline) {
      badge.className = 'inline-block w-2 h-2 rounded-full bg-emerald-400';
      text.innerText = '雲端已同步';
      if (meta) {
        const d = new Date(meta.updatedAt);
        info.innerText = `(最後更新: ${meta.updatedBy} @ ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')})`;
      }
    } else {
      badge.className = 'inline-block w-2 h-2 rounded-full bg-red-500';
      text.innerText = '離線狀態';
    }
  }

  // 1. 鎖定當日排班與日期異動控制
  function onDispatchDateChange() {
    const date = document.getElementById('dispatchDate').value;
    const lockBtn = document.getElementById('lockDispatchBtn');
    if (!date) {
      lockBtn.classList.add('hidden');
      return;
    }
    lockBtn.classList.remove('hidden');

    if (!AppState.dailyDispatchData) AppState.dailyDispatchData = {};
    if (!AppState.dailyDispatchData[date]) {
      AppState.dailyDispatchData[date] = { isLocked: false, groups: {} };
    }
    renderDispatchView(date);
    applyLockStateToUI(date);
  }

  async function toggleDispatchLock() {
    const date = document.getElementById('dispatchDate').value;
    if (!date) return alert('請先選擇日期');

    if (!AppState.dailyDispatchData[date]) {
      AppState.dailyDispatchData[date] = { isLocked: false, groups: {} };
    }
    const dayData = AppState.dailyDispatchData[date];
    dayData.isLocked = !dayData.isLocked;

    if (apiConfig.url) {
      await saveStateToCloud();
    }
    applyLockStateToUI(date);
    renderDispatchView(date);
  }

  function applyLockStateToUI(date) {
    const dayData = (AppState.dailyDispatchData && AppState.dailyDispatchData[date]) || { isLocked: false };
    const isLocked = dayData.isLocked;
    const lockBtn = document.getElementById('lockDispatchBtn');

    if (isLocked) {
      lockBtn.innerText = '🔓 解除鎖定 (已鎖定)';
      lockBtn.className = 'px-3 py-2 bg-slate-600 hover:bg-slate-500 text-white rounded-xl text-xs font-bold shadow transition flex items-center';
    } else {
      lockBtn.innerText = '🔒 鎖定當日排班';
      lockBtn.className = 'px-3 py-2 bg-red-600 hover:bg-red-500 text-white rounded-xl text-xs font-bold shadow transition flex items-center';
    }

    // 鎖定排班介面的所有輸入與操作控制項
    document.querySelectorAll('.dispatch-control').forEach(ctrl => {
      ctrl.disabled = isLocked;
      if (isLocked) {
        ctrl.classList.add('opacity-50', 'bg-slate-100', 'cursor-not-allowed');
      } else {
        ctrl.classList.remove('opacity-50', 'bg-slate-100', 'cursor-not-allowed');
      }
    });
  }

  // 2. 員工換組功能
  function openTransferModal(memberId, memberName, oldGroupId) {
    document.getElementById('transferMemberName').innerText = memberName;
    document.getElementById('transferMemberId').value = memberId;
    document.getElementById('transferOldGroupId').value = oldGroupId;

    const select = document.getElementById('transferTargetGroupSelect');
    select.innerHTML = '<option value="">-- 請選擇新組別 --</option>';

    (AppState.groupsData || []).forEach(group => {
      if (group.id !== oldGroupId) {
        const option = document.createElement('option');
        option.value = group.id;
        option.innerText = group.name;
        select.appendChild(option);
      }
    });
    openModal('transferGroupModal');
  }

  function closeTransferModal() { closeModal('transferGroupModal'); }

  async function confirmTransferGroup() {
    const memberId = document.getElementById('transferMemberId').value;
    const oldGroupId = document.getElementById('transferOldGroupId').value;
    const newGroupId = document.getElementById('transferTargetGroupSelect').value;

    if (!newGroupId) return alert('請選擇目標組別！');

    const oldGroup = AppState.groupsData.find(g => g.id === oldGroupId);
    const newGroup = AppState.groupsData.find(g => g.id === newGroupId);
    if (!oldGroup || !newGroup) return alert('找不到指定的組別');

    if (!oldGroup.members) oldGroup.members = [];
    const memberIndex = oldGroup.members.findIndex(m => m.id === memberId);
    if (memberIndex === -1) return alert('在原組別中找不到此同仁');

    const memberData = oldGroup.members.splice(memberIndex, 1)[0];
    if (!newGroup.members) newGroup.members = [];
    newGroup.members.push(memberData);

    closeTransferModal();
    if (apiConfig.url) await saveStateToCloud();
    alert(`${memberData.name} 已成功轉調至【${newGroup.name}】！`);
    renderDispatchView(document.getElementById('dispatchDate').value);
  }

  // 3. 月曆排休與渲染
  function onYearMonthChange() {
    const year = document.getElementById('leaveYearSelect').value;
    const month = document.getElementById('leaveMonthOnlySelect').value;
    currentYearMonth = `${year}-${month}`;
    loadMemberMonthlyLeave();
  }

  function setActiveLeaveType(type) {
    currentLeaveType = type;
  }

  function loadMemberMonthlyLeave() {
    const memberName = document.getElementById('leaveMemberSelect').value;
    if (!memberName) {
      document.getElementById('calendarGrid').innerHTML = '';
      return;
    }
    renderCalendar(currentYearMonth, memberName);
  }

  function renderCalendar(ym, memberName) {
    const [year, month] = ym.split('-').map(Number);
    const daysInMonth = new Date(year, month, 0).getDate();
    const firstDay = new Date(year, month - 1, 1).getDay();
    
    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';
    
    ['日', '一', '二', '三', '四', '五', '六'].forEach(day => {
      const el = document.createElement('div');
      el.className = 'text-[11px] font-bold text-slate-400 pb-1';
      el.innerText = day;
      grid.appendChild(el);
    });

    for (let i = 0; i < firstDay; i++) grid.appendChild(document.createElement('div'));

    const memberLeaves = (AppState.monthlyLeavesDb[ym] && AppState.monthlyLeavesDb[ym][memberName]) || {};
    let leaveDaysCount = 0;

    for (let i = 1; i <= daysInMonth; i++) {
      const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
      const leaveType = memberLeaves[dateStr] || '';
      if (leaveType) leaveDaysCount++;

      const el = document.createElement('div');
      el.className = `aspect-square rounded-xl flex flex-col items-center justify-center cursor-pointer border transition-all ${getLeaveStyle(leaveType)}`;
      el.innerHTML = `<span class="text-sm font-bold">${i}</span><span class="text-[10px] font-bold mt-0.5">${leaveType || '出勤'}</span>`;
      
      el.onclick = () => {
        if (!AppState.monthlyLeavesDb[ym]) AppState.monthlyLeavesDb[ym] = {};
        if (!AppState.monthlyLeavesDb[ym][memberName]) AppState.monthlyLeavesDb[ym][memberName] = {};
        
        if (currentLeaveType === '') delete AppState.monthlyLeavesDb[ym][memberName][dateStr];
        else AppState.monthlyLeavesDb[ym][memberName][dateStr] = currentLeaveType;
        
        renderCalendar(ym, memberName);
      };
      grid.appendChild(el);
    }
    document.getElementById('totalLeaveDaysBadge').innerText = leaveDaysCount;
  }

  function getLeaveStyle(type) {
    switch(type) {
      case '例假': return 'bg-red-50 text-red-600 border-red-200';
      case '排休': return 'bg-amber-50 text-amber-600 border-amber-200';
      case '特休': return 'bg-purple-50 text-purple-600 border-purple-200';
      case '國定假': return 'bg-blue-50 text-blue-600 border-blue-200';
      case '事病假': return 'bg-rose-50 text-rose-600 border-rose-200';
      default: return 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50';
    }
  }

  async function submitMonthlyLeave() {
    const memberName = document.getElementById('leaveMemberSelect').value;
    if (!memberName) return alert('請先選擇員工姓名！');
    
    const leavesArray = [];
    const memberLeaves = (AppState.monthlyLeavesDb[currentYearMonth] && AppState.monthlyLeavesDb[currentYearMonth][memberName]) || {};
    for (const [date, type] of Object.entries(memberLeaves)) {
      leavesArray.push({ date, type, remark: '' });
    }

    toggleLoading(true, '送出排休表...');
    try {
      if (apiConfig.url) {
        const res = await fetch(apiConfig.url, {
          method: 'POST',
          body: JSON.stringify({ action: 'submitLeave', memberName, yearMonth: currentYearMonth, leaves: leavesArray })
        });
        const result = await res.json();
        if (result.status === 'ok') {
          alert('排休表已成功儲存！');
          await saveStateToCloud();
        }
      } else {
        alert('已在本地暫存排休表！');
      }
    } catch (err) {
      alert('傳送失敗');
    }
    toggleLoading(false);
  }

  function updateUIWithData() {
    const select = document.getElementById('leaveMemberSelect');
    select.innerHTML = '<option value="">-- 請選擇姓名 --</option>';
    
    (AppState.groupsData || []).forEach(group => {
      (group.members || []).forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.name;
        opt.innerText = `${m.name} (${group.name})`;
        select.appendChild(opt);
      });
    });
    onDispatchDateChange();
  }

  function renderDispatchView(date) {
    const dayData = (AppState.dailyDispatchData && AppState.dailyDispatchData[date]) || { isLocked: false };
    const isLocked = dayData.isLocked;
    const container = document.getElementById('groupsContainer');
    container.innerHTML = '';

    let totalMembers = 0;
    (AppState.groupsData || []).forEach(group => {
      totalMembers += (group.members || []).length;
      
      const card = document.createElement('div');
      card.className = 'bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3';
      
      let membersHtml = '';
      (group.members || []).forEach(m => {
        membersHtml += `
          <div class="flex justify-between items-center bg-slate-50 p-2 rounded-xl border border-slate-100">
            <span class="text-xs font-bold text-slate-700">${m.name}</span>
            <div class="flex items-center space-x-1">
              <button onclick="openTransferModal('${m.id}', '${m.name}', '${group.id}')" ${isLocked ? 'disabled' : ''} class="dispatch-control text-[11px] px-2 py-1 bg-white hover:bg-slate-100 text-slate-600 border rounded-lg font-bold">調組</button>
            </div>
          </div>
        `;
      });

      card.innerHTML = `
        <div class="flex justify-between items-center border-b pb-2">
          <h3 class="font-bold text-sm text-slate-800 flex items-center">
            <span class="w-2 h-2 rounded-full bg-blue-600 mr-2"></span>${group.name}
          </h3>
          <span class="text-xs text-slate-400 font-bold">${(group.members || []).length} 人</span>
        </div>
        <div class="space-y-1.5">${membersHtml || '<p class="text-xs text-slate-400">尚無人員</p>'}</div>
      `;
      container.appendChild(card);
    });

    document.getElementById('totalMembers').innerText = `${totalMembers} 人`;
    lucide.createIcons();
  }

  document.addEventListener('DOMContentLoaded', () => {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('dispatchDate').value = today;
    document.getElementById('confirmDate').value = today;
    
    const now = new Date();
    document.getElementById('leaveYearSelect').value = now.getFullYear();
    document.getElementById('leaveMonthOnlySelect').value = String(now.getMonth() + 1).padStart(2, '0');
    
    updateUIWithData();
    onYearMonthChange();

    if (apiConfig.url) {
      document.getElementById('apiInput').value = apiConfig.url;
      document.getElementById('operatorNameInput').value = apiConfig.operator;
      fetchAppData();
    }
  });
</script>

</body>
</html>
