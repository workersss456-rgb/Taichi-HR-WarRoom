<!-- 系統提示與載入遮罩 -->
<div id="loadingOverlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[60] flex flex-col items-center justify-center hidden">
  <div class="animate-spin rounded-full h-10 w-10 border-4 border-blue-500 border-t-transparent mb-3"></div>
  <p class="text-white font-bold text-sm tracking-wide" id="loadingText">系統處理中，請稍候...</p>
</div>

<!-- 核心 JavaScript 邏輯 (UI與基礎互動) -->
<script>
  // 1. 啟動並渲染 Lucide Icons
  lucide.createIcons();

  // 2. 基礎分頁切換邏輯
  function switchTab(tabId) {
    // 隱藏所有視圖
    document.getElementById('view_dispatch').classList.add('hidden');
    document.getElementById('view_confirm').classList.add('hidden');
    document.getElementById('view_leave').classList.add('hidden');
    
    // 顯示目標視圖
    document.getElementById('view_' + tabId).classList.remove('hidden');

    // 重置所有按鈕樣式
    const tabs = ['dispatch', 'confirm', 'leave'];
    tabs.forEach(tab => {
      const btn = document.getElementById('tabBtn_' + tab);
      if (btn) {
        btn.classList.remove('bg-blue-600', 'text-white');
        btn.classList.add('text-slate-400');
      }
    });

    // 啟用當前按鈕樣式
    const activeBtn = document.getElementById('tabBtn_' + tabId);
    if (activeBtn) {
      activeBtn.classList.remove('text-slate-400');
      activeBtn.classList.add('bg-blue-600', 'text-white');
    }
  }

  // 3. Modal 開關通用邏輯
  function openModal(modalId) {
    document.getElementById(modalId).classList.remove('hidden');
  }
  
  function closeModal(modalId) {
    document.getElementById(modalId).classList.add('hidden');
  }

  // 各別 Modal 的開關封裝
  function openImportLeaveModal() { openModal('importLeaveModal'); }
  function closeImportLeaveModal() { closeModal('importLeaveModal'); }
  
  function openApiSettingModal() { openModal('apiSettingModal'); }
  function closeApiSettingModal() { closeModal('apiSettingModal'); }
  
  function openCreateGroupModal() { openModal('createGroupModal'); }
  function closeCreateGroupModal() { closeModal('createGroupModal'); }
  
  function openAddSiteGlobalModal() { openModal('addSiteModal'); }
  function closeSiteModal() { closeModal('addSiteModal'); }
  
  function openAddMemberModal() { openModal('addMemberModal'); }
  function closeAddMemberModal() { closeModal('addMemberModal'); }

  function showShareUrlModal(type) { openModal('shareUrlModal'); }
  function closeShareUrlModal() { closeModal('shareUrlModal'); }

  // 4. 初始化日期
  document.addEventListener('DOMContentLoaded', () => {
    const today = new Date().toISOString().split('T')[0];
    const dispatchDateInput = document.getElementById('dispatchDate');
    const confirmDateInput = document.getElementById('confirmDate');
    
    if (dispatchDateInput) dispatchDateInput.value = today;
    if (confirmDateInput) confirmDateInput.value = today;
  });

  // (其餘業務邏輯：Google Apps Script API 串接、日曆渲染、匯入匯出處理，請在此補上)
</script>

</body>
</html>
